<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DJ Logo Lightbox Flat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#06040B;--lime:#C0FA35;--text:#E4E1EC;--head:#F7F6FA}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);overflow:hidden;font-family:Jost,system-ui,sans-serif;color:var(--text)}
#stage{position:fixed;inset:0}
.ui{position:fixed;left:16px;bottom:16px;width:272px;padding:18px 20px;border-radius:22px;background:rgba(255,255,255,.067);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(20px);font-size:13px;z-index:2}
.ui b{display:block;color:var(--head);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:11px;margin:14px 0 8px}
.ui b:first-child{margin-top:0}
label{display:block;margin:10px 0 2px}label span{float:right;color:var(--lime);font-weight:600}
input[type=range]{width:100%;accent-color:var(--lime)}
.row{display:flex;gap:8px;margin-top:10px}
button{flex:1;font:600 13px Jost,system-ui,sans-serif;color:var(--head);background:rgba(255,255,255,.067);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:9px 12px;cursor:pointer}
button:hover{border-color:rgba(192,250,53,.5)}
button.on{background:var(--lime);color:#06040B;border-color:var(--lime)}
.track{height:4px;border-radius:2px;background:rgba(255,255,255,.14);margin-top:12px;overflow:hidden}
#bar{height:100%;width:0;background:var(--lime)}
.tl{font-size:11px;opacity:.6;margin-top:4px;text-align:right}
</style></head><body>
<div id="stage"></div>

  <label>Swing <span id="gmv">0.5</span></label><input type="range" id="gm" min="0" max="2" step="0.1" value="0.5">
  <label>Glow <span id="gv">1.0</span></label><input type="range" id="glow" min="0" max="2" step="0.05" value="1">
</div>
