<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Обложка Digital Jazz Cup: сетка 16 → 1 сходится к лаймовому эквалайзеру. Палитра проекта: фон #06040B, фиолетовый #A375FF, лайм #C0FA35. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="60%">
      <stop offset="0" stop-color="#3B1D7A" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#160B2E" stop-opacity=".9"/>
      <stop offset="1" stop-color="#06040B"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C0FA35" stop-opacity=".55"/>
      <stop offset="1" stop-color="#C0FA35" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#06040B"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <!-- световые лучи -->
  <g opacity=".35" filter="url(#soft)">
    <path d="M800 470 L180 0 L330 0 Z" fill="#A375FF"/>
    <path d="M800 470 L1420 0 L1270 0 Z" fill="#A375FF"/>
    <path d="M800 470 L620 0 L700 0 Z" fill="#C0FA35" opacity=".5"/>
    <path d="M800 470 L980 0 L900 0 Z" fill="#C0FA35" opacity=".5"/>
  </g>
  <!-- сетка: левая половина 8 → 4 → 2 → 1 -->
  <g fill="none" stroke="#A375FF" stroke-width="5" stroke-linecap="round" filter="url(#neon)">
    <path d="M90 130 H250 V210 H90 M90 290 H250 V370 H90 M90 530 H250 V610 H90 M90 690 H250 V770 H90"/>
    <path d="M250 170 H410 V330 H250 M250 570 H410 V730 H250"/>
    <path d="M410 250 H560 V650 H410"/>
    <path d="M560 450 H660"/>
    <path d="M1510 130 H1350 V210 H1510 M1510 290 H1350 V370 H1510 M1510 530 H1350 V610 H1510 M1510 690 H1350 V770 H1510"/>
    <path d="M1350 170 H1190 V330 H1350 M1350 570 H1190 V730 H1350"/>
    <path d="M1190 250 H1040 V650 H1190"/>
    <path d="M1040 450 H940"/>
  </g>
  <!-- путь победителя — лайм -->
  <g fill="none" stroke="#C0FA35" stroke-width="7" stroke-linecap="round" filter="url(#neon)">
    <path d="M90 290 H250 V330 H410 V450 H560 V450 H660"/>
    <path d="M1510 610 H1350 V570 H1190 V450 H1040 H940"/>
  </g>
  <!-- ядро: эквалайзер -->
  <circle cx="800" cy="450" r="230" fill="url(#core)"/>
  <circle cx="800" cy="450" r="150" fill="#06040B" stroke="#C0FA35" stroke-width="6" filter="url(#neon)"/>
  <g fill="#C0FA35" filter="url(#neon)">
    <rect x="712" y="420" width="16" height="60" rx="8"/>
    <rect x="740" y="385" width="16" height="130" rx="8"/>
    <rect x="768" y="355" width="16" height="190" rx="8"/>
    <rect x="796" y="395" width="16" height="110" rx="8"/>
    <rect x="824" y="370" width="16" height="160" rx="8"/>
    <rect x="852" y="405" width="16" height="90" rx="8"/>
    <rect x="880" y="430" width="16" height="40" rx="8"/>
  </g>
  <!-- искры -->
  <g fill="#C0FA35">
    <circle cx="660" cy="450" r="9"/><circle cx="940" cy="450" r="9"/>
    <circle cx="90" cy="290" r="8"/><circle cx="1510" cy="610" r="8"/>
  </g>
  <g fill="#A375FF" opacity=".8">
    <circle cx="420" cy="90" r="4"/><circle cx="1210" cy="120" r="5"/><circle cx="300" cy="820" r="4"/><circle cx="1320" cy="830" r="4"/><circle cx="980" cy="800" r="3"/><circle cx="600" cy="110" r="3"/>
  </g>
</svg>
