<main id="main" tabindex="-1">

  <div class="screen is-on" id="s-mine">
    <div class="heading"><h1>Мои курсы</h1></div>
    <a class="menu-links" style="display:flex;margin-bottom:18px" href="index.html"><div style="display:flex;justify-content:space-between;align-items:center;width:100%"><div><h3 style="font-size:19px">Каталог курсов</h3><p class="caption" style="margin-top:3px">Найти новый курс</p></div><span class="chevron">→</span></div></a>
    <div class="seg" id="mineSeg">
      <button type="button" aria-pressed="true" data-seg="active">Активные</button>
      <button type="button" aria-pressed="false" data-seg="done">Завершено</button>
      <button type="button" aria-pressed="false" data-seg="saved">Сохранённые</button>
    </div>
    <div class="stack" id="mineList"></div>
  </div>

  <div class="screen" id="s-course"></div>
  <div class="screen" id="s-lesson"></div>

</main>
<p class="demo-note">Интерактивный прототип · демоданные</p>
</div>

<div class="toast" id="toast"></div>
<div class="services-scrim" id="servicesScrim"></div>  <nav class="bottom-nav" id="bottomNav">

      <div class="bottom-nav-inner">

            <div class="services-row" data-service="афиша" role="button" tabindex="0"><div class="services-label glass">афиша</div><div class="services-circle glass"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.2V7a1.5 1.5 0 0 1 1.5-1.5h14A1.5 1.5 0 0 1 20.5 7v2.2a2.5 2.5 0 0 0 0 5V16a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 16v-1.8a2.5 2.5 0 0 0 0-5Z"/></svg></div></div>
            <div class="services-row" data-service="магазин" role="button" tabindex="0"><div class="services-label glass">магазин</div><div class="services-circle glass"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 12H6.2L5 8Z"/><path d="M9 8V6.4a3 3 0 0 1 6 0V8"/></svg></div></div>
            <div class="services-row" data-service="курсы" role="button" tabindex="0"><div class="services-label glass">курсы</div><div class="services-circle glass"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.8c3-1.4 6-1.4 8 0v12.4c-2-1.4-5-1.4-8 0V5.8Z"/><path d="M20 5.8c-3-1.4-6-1.4-8 0v12.4c2-1.4 5-1.4 8 0V5.8Z"/></svg></div></div>
          </div>

<script src="courses-common.js"></script>
<script>
(function(){
  function $(s,c){return (c||document).querySelector(s);}
  function $$(s,c){return Array.prototype.slice.call((c||document).querySelectorAll(s));}

  var seg = 'active';

  function flatLessons(c){
    var out = [];
    c.modules.forEach(function(m, mi){ m.lessons.forEach(function(l, li){ out.push({ module: m, moduleIndex: mi, lesson: l, lessonIndex: li }); }); });
    return out;
  }
  function courseState(c){
    var en = window.ENROLLMENTS.find(function(e){ return e.courseId === c.id; });
    var flat = flatLessons(c);
    var total = flat.length;
    var completed = en ? Math.min(total, Math.round(total * (en.progress || 0) / 100)) : 0;
    return { enrollment: en, flat: flat, total: total, completed: completed };
  }

  function mineCard(c){
    var st = courseState(c);
    if(seg === 'saved'){
      return window.djCourseCard({
        id:c.id, href:'#', kind:'announce', grad:c.grad, glyph:DJC.glyph(c.topic),
        topic:c.topic, level:c.level, title:c.title, big:DJC.priceLabel(c),
        facts:[['Автор', c.instructor]], role:'Сохранён из каталога',
      });
    }
    var pct = st.total ? Math.round(st.completed/st.total*100) : 0;
    var next = st.flat[st.completed];
    return window.djCourseCard({
      id:c.id, href:'#', kind: pct>=100?'done':'ready', grad:c.grad, glyph:DJC.glyph(c.topic),
      topic:c.topic, level:c.level, title:c.title, big: pct+'%',
      facts:[['Автор', c.instructor], ['Пройдено', st.completed+' из '+st.total]],
      role: pct>=100 ? 'Курс пройден' : (next ? 'Дальше: '+next.lesson.title : ''),
    });
  }

  function renderMine(){
    var ids;
    if(seg==='saved') ids = window.WISHLIST.slice();
    else ids = window.ENROLLMENTS.filter(function(e){ return e.status===seg; }).map(function(e){ return e.courseId; });
    var list = ids.map(window.courseById).filter(Boolean);
    $('#mineList').innerHTML = list.map(mineCard).join('') || '<div class="empty"><p class="secondary">'+(seg==='saved'?'Пока ничего не сохранено':'Пусто')+'</p></div>';
  }

  $$('#mineSeg button').forEach(function(b){
    b.addEventListener('click', function(){
      $$('#mineSeg button').forEach(function(x){ x.setAttribute('aria-pressed','false'); });
      b.setAttribute('aria-pressed','true');
      seg = b.dataset.seg;
      renderMine();
    });
  });

  function renderCourseHome(c){
    var st = courseState(c);
    var pct = st.total ? Math.round(st.completed/st.total*100) : 0;
    var modulesHtml = c.modules.map(function(m, mi){
      return '<div class="card c-module"><div class="c-module-head"><h3>'+m.name+'</h3></div>'
        + m.lessons.map(function(l, li){
            var flatIndex = st.flat.findIndex(function(f){ return f.moduleIndex===mi && f.lessonIndex===li; });
            var state = flatIndex < st.completed ? 'is-done' : (flatIndex === st.completed ? 'is-current' : '');
            var trail = flatIndex < st.completed ? DJC.ICON_CHECK : DJC.ICON_PLAY;
            return '<div class="c-lesson '+state+'" role="button" tabindex="0" data-lesson="'+flatIndex+'">'
              + '<span class="c-lesson-icon">'+DJC.lessonIcon(l.kind)+'</span>'
              + '<span class="c-lesson-body"><span class="c-lesson-title">'+l.title+'</span><span class="c-lesson-meta">'+l.min+' мин</span></span>'
              + '<span class="c-lesson-trail">'+trail+'</span>'
              + '</div>';
          }).join('')
        + '</div>';
    }).join('');

    $('#s-course').innerHTML =
      '<div class="row" style="margin-bottom:16px"><button class="icon" data-go="s-mine" aria-label="Назад">←</button></div>'
      + '<div class="c-hero-cover" style="background:'+c.grad+'"></div>'
      + '<div class="stack" style="margin-top:18px">'
        + '<div><p class="caption">'+c.topic+' · '+c.instructor+' · '+DJC.accessLabel(c)+'</p><h1 style="margin-top:4px">'+c.title+'</h1></div>'
        + '<div class="card"><div class="c-progress-row"><span class="secondary">'+(pct>=100?'Курс пройден':'Пройдено')+'</span><b>'+pct+'%</b></div><div class="c-progress"><i style="width:'+pct+'%"></i></div>'
          + '<div style="margin-top:14px">'+(pct>=100
              ? '<button class="secondary-button full" id="certBtn">Сертификат о прохождении</button>'
              : (st.flat[st.completed] ? '<p class="caption" style="margin-bottom:10px">Дальше: '+st.flat[st.completed].lesson.title+'</p>' : '')+'<button class="primary full" id="continueBtn">Продолжить</button>')
            +'</div>'
        + '</div>'
        + '<div><h2 style="margin-bottom:12px">Программа курса</h2>'+modulesHtml+'</div>'
      + '</div>';

    var cont = $('#continueBtn');
    if(cont) cont.addEventListener('click', function(){ openLesson(c, st.completed); });
    var cert = $('#certBtn');
    if(cert) cert.addEventListener('click', function(){ say('Сертификат — демо, PDF пока не собирается'); });
    $$('#s-course .c-lesson').forEach(function(row){
      row.addEventListener('click', function(){ openLesson(c, parseInt(row.dataset.lesson, 10)); });
    });
  }

  /* ---- медиа-блок урока по типу: видео-плеер / текст / задание с ответом / тест с вопросами ---- */
  function lessonMedia(l){
    if(l.kind==='doc'){
      var d = l.doc || {};
      return '<div class="card"><p class="secondary" style="white-space:pre-line">'+(d.text||'Материал урока скоро появится.')+'</p></div>';
    }
    if(l.kind==='task'){
      var t = l.task || {};
      return '<div class="card"><p class="caption" style="margin-bottom:6px">Задание</p><p class="secondary">'+(t.task||'Описание задания скоро появится.')+'</p></div>'
        + '<div class="field" style="margin-top:14px"><label for="taskAnswer">'+(t.deliverable?('Что прислать: '+t.deliverable):'Ваш ответ')+'</label><textarea id="taskAnswer" rows="4" placeholder="Опишите или вставьте ссылку на результат"></textarea></div>'
        + '<div id="taskSubmitArea"><button class="secondary-button full" id="submitTaskBtn">Отправить на проверку</button></div>';
    }
    if(l.kind==='test'){
      var qs = (l.test && l.test.questions) || [];
      return '<div class="stack" id="testForm">'
        + qs.map(function(q, qi){
            return '<div class="card"><p class="secondary" style="margin-bottom:10px">'+(qi+1)+'. '+q.q+'</p>'
              + '<div class="stack" style="gap:8px">'
              + (q.options||[]).map(function(opt, oi){
                  return '<label class="row" style="gap:10px"><input type="radio" name="test-q'+qi+'" class="tq-opt" value="'+oi+'">'+'<span>'+opt+'</span></label>';
                }).join('')
              + '</div></div>';
          }).join('')
        + '<button class="primary full" id="checkTestBtn">Проверить ответы</button>'
        + '<div id="testResult"></div>'
      + '</div>';
    }
    var v = l.video || {};
    return '<div class="c-player"><div class="c-player-play">'+DJC.ICON_PLAY.replace('width="16" height="16"','width="24" height="24"')+'</div><span class="c-player-time">0:00 / '+l.min+':00</span></div>'
      + (v.note ? '<p class="caption" style="margin-top:10px">'+v.note+'</p>' : '');
  }

  function openLesson(c, index){
    var st = courseState(c);
    var item = st.flat[index];
    if(!item) return;
    var l = item.lesson;
    var done = index < st.completed;
    var atFrontier = index === st.completed;
    var gated = atFrontier && (l.kind==='task' || l.kind==='test');

    $('#s-lesson').innerHTML =
      '<div class="row" style="margin-bottom:16px"><button class="icon" data-lesson-back="'+c.id+'" aria-label="Назад">←</button></div>'
      + lessonMedia(l)
      + '<div class="stack" style="margin-top:18px">'
        + '<div><p class="caption">'+item.module.name+' · '+DJC.kindLabel(l.kind)+'</p><h1 style="margin-top:4px;font-size:26px">'+l.title+'</h1></div>'
        + '<div class="row">'
          + (index>0 ? '<button class="secondary-button" data-lesson-nav="'+(index-1)+'" data-course="'+c.id+'">← Назад</button>' : '<span></span>')
          + (done ? '<span class="secondary" style="margin-left:auto">Пройден</span>'
              : atFrontier && !gated ? '<button class="primary" id="markDoneBtn" style="margin-left:auto">Отметить пройденным</button>'
              : atFrontier ? '<span class="caption" style="margin-left:auto">'+(l.kind==='task'?'Отправьте ответ выше':'Пройдите тест выше')+'</span>'
              : '<span class="caption" style="margin-left:auto">Откроется по очереди</span>')
        + '</div>'
        + '<div id="gatedDoneArea"></div>'
        + (index < st.total-1 ? '<button class="secondary-button full" data-lesson-nav="'+(index+1)+'" data-course="'+c.id+'">Следующий урок →</button>' : '')
      + '</div>';

    function markDone(){
      var en = window.ENROLLMENTS.find(function(e){ return e.courseId===c.id; });
      var newCompleted = index+1;
      en.progress = Math.round(newCompleted/st.total*100);
      if(en.progress>=100) en.status='done';
      if(newCompleted >= st.total){ say('Курс «'+c.title+'» пройден полностью'); renderCourseHome(c); go('s-course'); }
      else { say('Урок отмечен пройденным'); openLesson(c, index+1); }
    }

    var mark = $('#markDoneBtn');
    if(mark) mark.addEventListener('click', markDone);

    var submitTask = $('#submitTaskBtn');
    if(submitTask) submitTask.addEventListener('click', function(){
      $('#taskSubmitArea').innerHTML = '<p class="caption">Отправлено на проверку преподавателю</p>';
      $('#gatedDoneArea').innerHTML = '<button class="primary full" id="markDoneBtn2" style="margin-top:12px">Отметить пройденным</button>';
      $('#markDoneBtn2').addEventListener('click', markDone);
      say('Ответ отправлен на проверку');
    });

    var checkTest = $('#checkTestBtn');
    if(checkTest) checkTest.addEventListener('click', function(){
      var qs = (l.test && l.test.questions) || [];
      var ok = 0;
      qs.forEach(function(q, qi){
        var picked = $('input[name="test-q'+qi+'"]:checked');
        if(picked && parseInt(picked.value,10) === q.correct) ok++;
      });
      var score = qs.length ? Math.round(ok/qs.length*100) : 100;
      var passScore = (l.test && l.test.passScore) || 70;
      var passed = score >= passScore;
      $('#testResult').innerHTML = '<div class="card" style="margin-top:14px"><p class="secondary">Результат: <b style="color:'+(passed?'var(--dj-lime)':'var(--dj-magenta)')+'">'+score+'%</b> · проходной балл '+passScore+'%</p>'
        + '<p class="caption" style="margin-top:4px">'+(passed?'Тест пройден':'Попробуйте ещё раз — выберите ответы и нажмите «Проверить» снова')+'</p></div>';
      if(passed){
        $('#gatedDoneArea').innerHTML = '<button class="primary full" id="markDoneBtn2" style="margin-top:12px">Отметить пройденным</button>';
        $('#markDoneBtn2').addEventListener('click', markDone);
      }
    });

    go('s-lesson');
  }

  document.addEventListener('click', function(e){
    var link = e.target.closest('.t-card-link');
    if(link){
      var card = link.closest('[data-course-id]');
      if(card){ e.preventDefault(); var c = window.courseById(card.dataset.courseId); if(c){ renderCourseHome(c); go('s-course'); } }
    }
    var back = e.target.closest('[data-go]');
    if(back){ go(back.dataset.go); }
    var lback = e.target.closest('[data-lesson-back]');
    if(lback){ var c2 = window.courseById(lback.dataset.lessonBack); if(c2){ renderCourseHome(c2); go('s-course'); } }
    var lnav = e.target.closest('[data-lesson-nav]');
    if(lnav){ var c3 = window.courseById(lnav.dataset.course); if(c3){ openLesson(c3, parseInt(lnav.dataset.lessonNav,10)); } }
  });

  document.addEventListener('DOMContentLoaded', function(){ renderMine(); });
})();
</script>
</body>
</html>
