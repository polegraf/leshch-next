<main id="main" tabindex="-1">

</main>

            <div class="services-row" data-service="афиша" role="button" tabindex="0"><div class="services-label glass">афиша</div><div class="services-circle glass"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.2V7a1.5 1.5 0 0 1 1.5-1.5h14A1.5 1.5 0 0 1 20.5 7v2.2a2.5 2.5 0 0 0 0 5V16a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 16v-1.8a2.5 2.5 0 0 0 0-5Z"/></svg></div></div>
            <div class="services-row" data-service="магазин" role="button" tabindex="0"><div class="services-label glass">магазин</div><div class="services-circle glass"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 12H6.2L5 8Z"/><path d="M9 8V6.4a3 3 0 0 1 6 0V8"/></svg></div></div>
            <div class="services-row" data-service="курсы" role="button" tabindex="0"><div class="services-label glass">курсы</div><div class="services-circle glass"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.8c3-1.4 6-1.4 8 0v12.4c-2-1.4-5-1.4-8 0V5.8Z"/><path d="M20 5.8c-3-1.4-6-1.4-8 0v12.4c2-1.4 5-1.4 8 0V5.8Z"/></svg></div></div>

<script src="courses-common.js"></script>
<script>
(function(){
  function $(s,c){return (c||document).querySelector(s);}
  function $$(s,c){return Array.prototype.slice.call((c||document).querySelectorAll(s));}
  var AUTHOR = 'DJ Контур';
  function myCourses(){ return window.COURSES.filter(function(c){ return c.instructor === AUTHOR; }); }

  function renderStats(){
    var mine = myCourses();
    var students = mine.reduce(function(n,c){return n+c.students;},0);
    var month = mine.reduce(function(n,c){return n+c.revenueMonth;},0);
    var total = mine.reduce(function(n,c){return n+c.revenueTotal;},0);
    $('#authorStats').innerHTML =
      '<div class="card c-stat"><b>'+students+'</b><span>УЧЕНИКОВ</span></div>'
      + '<div class="card c-stat"><b>'+DJC.fmtRub(month)+'</b><span>ЗА МЕСЯЦ</span></div>'
      + '<div class="card c-stat"><b>'+DJC.fmtRub(total)+'</b><span>ВСЕГО</span></div>';
  }

  function cardFor(c){
    var stage = DJC.stageFor(c);
    var lessons = c.modules.reduce(function(n,m){return n+m.lessons.length;}, 0);
    return window.djCourseCard({
      id:c.id, href:'#', kind:stage.kind, grad:c.grad, glyph:DJC.glyph(c.topic),
      stageLabel:stage.label, stageTone:stage.tone, topic:c.topic, level:c.level, title:c.title,
      big: c.status==='draft' ? 'Не опубликован' : DJC.fmtRub(c.revenueMonth)+' в мес.',
      facts:[['Уроков', String(lessons)], ['Учеников', String(c.students)]],
      role: c.status==='draft' ? 'Продолжить заполнение' : 'Открыть курс',
    });
  }
  function renderMine(){ $('#mineList').innerHTML = myCourses().map(cardFor).join(''); }

  function renderCourse(c){
    var lessons = c.modules.reduce(function(n,m){return n+m.lessons.length;}, 0);
    var stage = DJC.stageFor(c);
    $('#t-course').innerHTML =
      '<div class="row" style="margin-bottom:16px"><button class="icon" data-go="t-mine" aria-label="Назад">←</button></div>'
      + '<div class="c-hero-cover" style="background:'+c.grad+'"><span class="aud-badge">'+tournamentStatus(stage.label, stage.tone)+'</span></div>'
      + '<div class="stack" style="margin-top:18px">'
        + '<div><p class="caption">'+c.topic+' · '+c.level+'</p><h1 style="margin-top:4px">'+c.title+'</h1></div>'
        + '<div class="c-stat-row"><div class="card c-stat"><b>'+c.students+'</b><span>УЧЕНИКОВ</span></div><div class="card c-stat"><b>'+c.completion+'%</b><span>ДОХОДИМОСТЬ</span></div><div class="card c-stat"><b>'+DJC.fmtRub(c.revenueTotal)+'</b><span>ЗАРАБОТАНО</span></div></div>'
        + '<div class="menu-links">'
          + '<a href="#" data-open="editor"><div><h3 style="font-size:19px">Программа курса</h3><p class="caption" style="margin-top:3px">'+c.modules.length+' модулей · '+lessons+' уроков</p></div><span class="chevron">→</span></a>'
          + (c.status!=='draft' ? '<a href="#" data-open="students"><div><h3 style="font-size:19px">Ученики</h3><p class="caption" style="margin-top:3px">'+(window.ROSTER[c.id]||[]).length+' активных за последнее время</p></div><span class="chevron">→</span></a>' : '')
          + (c.status!=='draft' ? '<a href="#" data-open="earnings"><div><h3 style="font-size:19px">Доход</h3><p class="caption" style="margin-top:3px">'+DJC.fmtRub(c.revenueMonth)+' за этот месяц</p></div><span class="chevron">→</span></a>' : '')
        + '</div>'
        + '<p class="secondary">'+c.summary+'</p>'
        + '<button class="'+(c.status==='draft'?'primary':'secondary-button')+' full" id="publishBtn">'+(c.status==='draft'?'Опубликовать курс':'Снять с публикации')+'</button>'
      + '</div>';

    $$('#t-course [data-open]').forEach(function(a){
      a.addEventListener('click', function(e){
        e.preventDefault();
        var k = a.dataset.open;
        if(k==='editor'){ renderEditor(c); go('t-editor'); }
        if(k==='students'){ renderStudents(c); go('t-students'); }
        if(k==='earnings'){ renderEarnings(c); go('t-earnings'); }
      });
    });
    $('#publishBtn').addEventListener('click', function(){
      c.status = c.status==='draft' ? 'published' : 'draft';
      say(c.status==='draft' ? 'Курс снят с публикации' : 'Курс опубликован — виден в каталоге');
      renderMine(); renderStats(); renderCourse(c);
    });
  }

  function renderEditor(c){
    $('#t-editor').innerHTML =
      '<div class="row" style="margin-bottom:16px"><button class="icon" data-go="t-course" aria-label="Назад">←</button></div>'
      + '<div class="heading"><h1 style="font-size:26px">Программа курса</h1></div>'
      + '<p class="caption" style="margin-bottom:14px">Перетащите модуль за ручку, чтобы изменить порядок</p>'
      + '<div class="stack" id="modulesList">'
      + c.modules.map(function(m, i){
          return '<div class="dj-card card c-editor-module" data-module="'+i+'">'
            + '<span class="dj-handle" data-drag-handle aria-label="Перетащить"><svg width="27" height="27" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></span>'
            + '<span class="grow"><h3>'+m.name+'</h3><p class="caption">'+m.lessons.length+' '+DJC.plural(m.lessons.length,['урок','урока','уроков'])+'</p></span>'
            + '<span class="chevron">⋯</span>'
            + '</div>';
        }).join('')
      + '</div>'
      + '<button class="text-button" id="addModuleBtn" style="margin-top:8px">+ Добавить модуль</button>';

    $('#addModuleBtn').addEventListener('click', function(){ say('Добавление модуля — демо'); });
    $$('#modulesList .c-editor-module .chevron').forEach(function(ch){ ch.addEventListener('click', function(){ say('Редактирование уроков модуля — демо'); }); });

    var list = $('#modulesList');
    var dragging=null, startY=0, startTop=0;
    function rects(){ return $$(':scope > *', list).map(function(el){ var r=el.getBoundingClientRect(); return {el:el, top:r.top, bottom:r.bottom}; }); }
    list.addEventListener('pointerdown', function(e){
      var handle = e.target.closest('[data-drag-handle]'); if(!handle) return;
      var card = handle.closest('.dj-card'); if(!card || card.parentNode!==list) return;
      e.preventDefault();
      dragging=card; startY=e.clientY; startTop=card.getBoundingClientRect().top;
      card.classList.add('dragging'); card.style.position='relative'; card.style.zIndex=50;
      handle.classList.add('is-dragging'); handle.setPointerCapture(e.pointerId);
      document.addEventListener('pointermove', onMove); document.addEventListener('pointerup', onUp);
    });
    function onMove(e){
      if(!dragging) return;
      var dy = e.clientY - startY;
      dragging.style.transform = 'translateY('+dy+'px)';
      var rr = rects(); var dr = dragging.getBoundingClientRect(); var mid = dr.top + dr.height/2;
      for(var i=0;i<rr.length;i++){
        var r=rr[i]; if(r.el===dragging) continue;
        if(mid>r.top && mid<r.bottom){
          var di = Array.prototype.indexOf.call(list.children, dragging);
          var ti = Array.prototype.indexOf.call(list.children, r.el);
          if(di<ti) list.insertBefore(dragging, r.el.nextSibling); else list.insertBefore(dragging, r.el);
          var newTop = dragging.getBoundingClientRect().top; var visualTop = startTop+dy;
          startTop=newTop; startY=e.clientY; dragging.style.transform='translateY('+(visualTop-newTop)+'px)';
          break;
        }
      }
    }
    function onUp(){
      if(!dragging) return;
      var card=dragging; card.style.transform='translateY(0px)'; card.classList.remove('dragging'); card.style.zIndex='';
      var h=card.querySelector('[data-drag-handle]'); if(h) h.classList.remove('is-dragging');
      dragging=null;
      document.removeEventListener('pointermove', onMove); document.removeEventListener('pointerup', onUp);
      card.style.position='';
      var order = $$('#modulesList .c-editor-module').map(function(el){ return parseInt(el.dataset.module,10); });
      c.modules = order.map(function(i){ return c.modules[i]; });
      $$('#modulesList .c-editor-module').forEach(function(el,i){ el.dataset.module = i; });
      say('Порядок модулей обновлён');
    }
  }

  function renderStudents(c){
    var roster = window.ROSTER[c.id] || [];
    $('#t-students').innerHTML =
      '<div class="row" style="margin-bottom:16px"><button class="icon" data-go="t-course" aria-label="Назад">←</button></div>'
      + '<div class="heading"><h1 style="font-size:26px">Ученики</h1></div>'
      + '<p class="caption" style="margin-bottom:14px">Показаны последние активные — не весь список из '+c.students+'</p>'
      + '<div class="card">'
      + roster.map(function(s){
          return '<div class="c-student-row"><span class="portrait">'+DJC.initials(s.name)+'</span>'
            + '<span class="c-student-info"><span style="font-size:17px">'+s.name+'</span>'
            + '<span class="c-student-progress"><span class="c-progress"><i style="width:'+s.progress+'%"></i></span><span>'+s.progress+'%</span></span></span>'
            + '<span class="caption">'+s.last+'</span></div>';
        }).join('')
      + '</div>';
  }

  function renderEarnings(c){
    $('#t-earnings').innerHTML =
      '<div class="row" style="margin-bottom:16px"><button class="icon" data-go="t-course" aria-label="Назад">←</button></div>'
      + '<div class="heading"><h1 style="font-size:26px">Доход</h1></div>'
      + '<div class="card"><p class="caption">Всего заработано на «'+c.title+'»</p><p class="c-price" style="margin:6px 0 14px">'+DJC.fmtRub(c.revenueTotal)+'</p><button class="secondary-button full" id="payoutBtn">Вывести</button></div>'
      + '<div class="card" style="margin-top:14px"><div class="c-price-row"><span class="secondary">За этот месяц</span><span class="c-price">'+DJC.fmtRub(c.revenueMonth)+'</span></div><p class="caption" style="margin-top:8px">'+c.students+' '+DJC.plural(c.students,['ученик','ученика','учеников'])+' · '+DJC.fmtRub(c.price)+' за курс</p></div>';
    $('#payoutBtn').addEventListener('click', function(){ say('Вывод средств — демо, без реальной выплаты'); });
  }

  document.addEventListener('click', function(e){
    var link = e.target.closest('.t-card-link');
    if(link){
      var card = link.closest('[data-course-id]');
      if(card){ e.preventDefault(); var c = window.courseById(card.dataset.courseId); if(c){ renderCourse(c); go('t-course'); } }
    }
    var back = e.target.closest('[data-go]');
    if(back){ go(back.dataset.go); }
  });
  $('#newCourseBtn').addEventListener('click', function(){ say('Создание нового курса — демо'); });

  document.addEventListener('DOMContentLoaded', function(){ renderStats(); renderMine(); });
})();
</script>
</body>
</html>
