function layout(t){

    r.meshes.forEach(function(m,j){
      var f=phiAt(j/r.n+(r.off+t*dir)/(Math.PI*2));
      var x=Math.sin(f)*A,z=Math.cos(f)*B;
      var nx=Math.sin(f)/A,nz=Math.cos(f)/B;               // нормаль эллипса
      m.position.set(x,r.y,z);m.rotation.set(0,Math.atan2(nx,nz),0);

    });
  });
}
