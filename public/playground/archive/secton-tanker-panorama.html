<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Secton — tanker panorama</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0b0e11;
    overflow: hidden;
  }
  #stage { position: relative; width: 100vw; height: 100vh; }
  canvas#fx { position: absolute; inset: 0; display: block; cursor: grab; touch-action: none; }
  canvas#fx.dragging { cursor: grabbing; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="fx"></canvas>
</div>

<script>
(function () {
  // ---------------------------------------------------------------
  // Настройки — можно крутить под бренд
  // ---------------------------------------------------------------
  const CONFIG = {
    bg:              '#0b0e11',   // фон
    lineColor:       '229, 217, 191', // RGB строкой, тёплый оффвайт под якорь/латунь
    lineWidth:       0.9,          // чуть толще 0.7 — тонкие sub-pixel линии сильнее всего "плывут" между движками
    rows:            96,          // число рядов — чем больше, тем глаже "рельеф"
    colSpacing:      4,           // шаг точек по горизонтали, px
    shipWidthRatio:  0.92,        // ширина силуэта относительно ширины "мира" (см. worldScale)
    maskBlurScale:   1 / 5,       // меньше даунсемплим, чем в эффекте лого — у танкера больше мелких деталей
    maxLift:         46,          // максимальный подъём линий внутри заливки силуэта, px
    liftGamma:       1.35,        // резкость перехода фон -> силуэт (>1 — резче)
    idleAmp:         1.8,         // лёгкое "дыхание" поверх подъёма, px
    idleSpeed:       0.5,         // скорость дыхания
    refWidth:        1600,        // ширина (px), на которой откалиброван эффект — см. fxScale ниже

    // -- панорамирование и псевдо-вращение вместо курсорного искажения --
    worldScale:      1.55,        // во сколько раз "мир" (полотно с танкером) шире экрана — задаёт диапазон панорамы
    panDragSpeed:    1.0,         // множитель для dx перетаскивания -> панорама
    idlePanSpeed:    0.10,        // скорость авто-панорамы в простое (рад/сек фазы синусоиды)
    panSpring:       0.05,        // упругость панорамы к цели
    panDamping:      0.88,        // затухание панорамы
    maxTiltSlope:    0.34,        // макс. "наклон" — px смещения по Y на px удаления по X от центра мира
    tiltDragSpeed:   0.0026,      // множитель для dy перетаскивания -> наклон (псевдо-вращение)
    tiltSpring:      0.08,        // упругость наклона к цели
    tiltDamping:     0.80,        // затухание наклона
    tiltRelax:       0.05,        // как быстро цель наклона возвращается к 0, когда отпустили курсор
  };

  // ---------------------------------------------------------------
  // Силуэт танкера (собственный SVG, не сторонний, вставлен как есть)

<circle cx="580.0" cy="337.6" r="7.0"/>

<circle cx="760.0" cy="329.8" r="7.0"/>

<circle cx="1120.0" cy="314.3" r="7.0"/>

<circle cx="1300.0" cy="306.5" r="7.0"/>

<circle cx="1480.0" cy="298.7" r="7.0"/>
</svg>`;

  const SHIP_ASPECT = 2000 / 660;

  // ---------------------------------------------------------------
  // Canvas setup
  // ---------------------------------------------------------------
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio || 1, 3);

  let W = 0, H = 0;
  let lines = [];         // массив рядов, каждый — массив точек (координаты экрана)
  let maskData = null;    // ImageData мягкой альфа-маски силуэта, размер maskWorldW x H
  let maskWorldW = 0;     // ширина "мира" маски в px (шире экрана — источник панорамы)
  let maxPan = 0;         // максимальное смещение панорамы, px
  let fxScale = 1;

  let t0 = performance.now();
  let lastNow = null;

  // -- панорама (влево/вправо = скольжение камеры вдоль корпуса) --
  let panX = 0, panVX = 0, targetPanX = 0;
  let idlePhase = 0;

  // -- псевдо-вращение (вверх/вниз = "наклон" рельефа, как будто судно
  //    подворачивает к камере/от камеры) --
  let tiltSlope = 0, tiltVX = 0, targetTiltSlope = 0;

  let dragging = false, lastX = 0, lastY = 0;

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function resize() {
    const rect = stage.getBoundingClientRect();
    W = Math.max(1, Math.round(rect.width));
    H = Math.max(1, Math.round(rect.height));
    fxScale = clamp(W / CONFIG.refWidth, 0.55, 1.8);
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildGrid();
    buildMask();
  }

  // Растеризуем SVG-силуэт в "мир", который шире экрана (worldScale), чтобы
  // панорама могла скользить вдоль корпуса и открывать нос/корму крупнее —
  // сначала в маленьком разрешении, потом апскейлим (мягкая заблюренная маска).
  function buildMask() {
    maskWorldW = Math.max(W, Math.round(W * CONFIG.worldScale));
    maxPan = Math.max(0, maskWorldW - W);
    targetPanX = clamp(targetPanX, 0, maxPan);
    panX = clamp(panX, 0, maxPan);

    const smallW = Math.max(80, Math.round(maskWorldW * CONFIG.maskBlurScale));
    const smallH = Math.max(60, Math.round(H * CONFIG.maskBlurScale));

    const small = document.createElement('canvas');
    small.width = smallW;
    small.height = smallH;
    const sctx = small.getContext('2d');

    const shipW = smallW * CONFIG.shipWidthRatio;
    const shipH = shipW / SHIP_ASPECT;
    const x = (smallW - shipW) / 2;
    const y = (smallH - shipH) / 2;

    const svgBlob = new Blob([SHIP_SVG], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = function () {
      sctx.clearRect(0, 0, smallW, smallH);
      sctx.drawImage(img, x, y, shipW, shipH);
      URL.revokeObjectURL(url);

      const off = document.createElement('canvas');
      off.width = maskWorldW;
      off.height = H;
      const octx = off.getContext('2d');
      octx.imageSmoothingEnabled = true;
      octx.imageSmoothingQuality = 'high';
      octx.drawImage(small, 0, 0, smallW, smallH, 0, 0, maskWorldW, H);
      maskData = octx.getImageData(0, 0, maskWorldW, H);
    };
    img.src = url;
  }

  function alphaAt(px, py) {
    if (!maskData) return 0;
    const xi = px | 0, yi = py | 0;
    if (xi < 0 || yi < 0 || xi >= maskWorldW || yi >= H) return 0;
    const idx = (yi * maskWorldW + xi) * 4 + 3;
    return maskData.data[idx] / 255;
  }

  function buildGrid() {
    lines = [];
    const rowSpacing = H / CONFIG.rows;
    const cols = Math.ceil(W / CONFIG.colSpacing) + 1;

    for (let r = 0; r < CONFIG.rows; r++) {
      const baseY = r * rowSpacing + rowSpacing / 2;
      const pts = [];
      for (let c = 0; c < cols; c++) {
        const baseX = c * CONFIG.colSpacing;
        pts.push({
          bx: baseX, by: baseY,
          x: baseX, y: baseY,
          vx: 0, vy: 0,
          phase: Math.random() * Math.PI * 2,
          freq: CONFIG.idleSpeed * (0.7 + Math.random() * 0.6),
        });
      }
      lines.push(pts);
    }
  }

  function step(now) {
    const t = (now - t0) / 1000;
    const dt = lastNow ? Math.min(0.05, (now - lastNow) / 1000) : 0.016;
    lastNow = now;

    // -- обновляем цель панорамы: в простое — медленно скользит сама (синусоида
    //    по всему доступному диапазону), при перетаскивании цель задаёт курсор/палец --
    if (!dragging) {
      idlePhase += dt * CONFIG.idlePanSpeed;
      targetPanX = (Math.sin(idlePhase) * 0.5 + 0.5) * maxPan;
      targetTiltSlope += (0 - targetTiltSlope) * CONFIG.tiltRelax;
    }

    panVX += (targetPanX - panX) * CONFIG.panSpring;
    panVX *= CONFIG.panDamping;
    panX += panVX;

    tiltVX += (targetTiltSlope - tiltSlope) * CONFIG.tiltSpring;
    tiltVX *= CONFIG.tiltDamping;
    tiltSlope += tiltVX;

    const worldCenterX = maskWorldW / 2;

    ctx.fillStyle = CONFIG.bg;
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = `rgba(${CONFIG.lineColor}, 0.9)`;
    ctx.lineWidth = CONFIG.lineWidth * fxScale;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (let r = 0; r < lines.length; r++) {
      const pts = lines[r];
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];

        // где в "мире" сейчас находится эта колонка сетки с учётом панорамы,
        // плюс сдвиг по Y пропорционально удалению от центра — это и даёт
        // ощущение наклона/поворота корпуса без настоящей 3D-геометрии
        const worldX = p.bx + panX;
        const shearY = (worldX - worldCenterX) * tiltSlope;
        const m = alphaAt(worldX, p.by + shearY);
        const lift = Math.pow(m, CONFIG.liftGamma) * CONFIG.maxLift * fxScale;
        const idleWobble = Math.sin(t * p.freq + p.phase) * CONFIG.idleAmp * fxScale * m;

        const targetX = p.bx;
        const targetY = p.by - lift + idleWobble;

        p.vx += (targetX - p.x) * 0.10;
        p.vx *= 0.82;
        p.x += p.vx;

        p.vy += (targetY - p.y) * 0.10;
        p.vy *= 0.82;
        p.y += p.vy;

        if (i === 0) {
          ctx.moveTo(p.x, p.y);
        } else {
          const prev = pts[i - 1];
          const mx = (prev.x + p.x) / 2;
          const my = (prev.y + p.y) / 2;
          ctx.quadraticCurveTo(prev.x, prev.y, mx, my);
        }
      }
      ctx.stroke();
    }

    requestAnimationFrame(step);
  }

  // ---------------------------------------------------------------
  // Drag = панорама (X) + псевдо-вращение (Y). Инерция после отпускания,
  // и панорама плавно возвращается к авто-скольжению без рывка.
  // ---------------------------------------------------------------
  function onPointerDown(e) {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    canvas.classList.add('dragging');
    if (canvas.setPointerCapture) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
  }
  function onPointerMove(e) {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    targetPanX = clamp(targetPanX - dx * CONFIG.panDragSpeed, 0, maxPan);
    targetTiltSlope = clamp(targetTiltSlope + dy * CONFIG.tiltDragSpeed, -CONFIG.maxTiltSlope, CONFIG.maxTiltSlope);
  }
  function onPointerUp() {
    if (!dragging) return;
    dragging = false;
    canvas.classList.remove('dragging');
    // возобновляем авто-панораму с текущей позиции, без скачка
    const ratio = maxPan > 0 ? clamp(targetPanX / maxPan, 0, 1) : 0;
    idlePhase = Math.asin(clamp(ratio * 2 - 1, -1, 1));
  }

  canvas.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) {
    new ResizeObserver(() => resize()).observe(stage);
  }

  resize();
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
